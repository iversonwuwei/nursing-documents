openapi: 3.1.0
info:
  title: Nursing Backend BFF API
  version: 0.1.0-phase1
  summary: Phase 1 BFF contract for content management, nursing workflow, and AI surfaces.
  description: |
    This specification captures the currently real backend-facing API surface audited from the admin frontend.
    It is intentionally scoped to phase 1 BFF contracts instead of every future domain endpoint.
servers:
  - url: https://api.example.com
    description: Gateway ingress example
tags:
  - name: ContentManagement
  - name: NursingWorkflow
  - name: AdminAI
  - name: NaniAI
  - name: FamilyAI
paths:
  /api/admin/static-texts:
    get:
      tags: [ContentManagement]
      summary: Query static texts
      operationId: listStaticTexts
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ns
          schema:
            type: string
        - in: query
          name: locale
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Static text list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticTextListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [ContentManagement]
      summary: Create a static text
      operationId: createStaticText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticTextCreateRequest'
      responses:
        '200':
          description: Static text created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticTextResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/admin/static-texts/{id}:
    get:
      tags: [ContentManagement]
      summary: Get static text detail
      operationId: getStaticText
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Static text detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticTextResponse'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [ContentManagement]
      summary: Update static text
      operationId: updateStaticText
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticTextUpdateRequest'
      responses:
        '200':
          description: Static text updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticTextResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/admin/static-texts/namespaces:
    get:
      tags: [ContentManagement]
      summary: List static text namespaces
      operationId: listStaticTextNamespaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Namespace list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          $ref: '#/components/responses/Problem'
  /api/admin/option-groups:
